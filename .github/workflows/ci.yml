name: public-toolkit-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the checkout's environment (uv workspace)
        run: uv sync --python ${{ matrix.python-version }}
      - name: Run standalone offline gate
        run: uv run python tools/public_release_gate.py

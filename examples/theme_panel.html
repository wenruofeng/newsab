<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Narrative Diff Toolkit theme tokens</title><style>:root{font:16px/1.5 system-ui;color:#18201d;background:#f7f5ef}*{box-sizing:border-box}main{width:min(56rem,calc(100% - 2rem));margin:3rem auto}fieldset{border:0;padding:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem}.card{display:grid;gap:.5rem;background:white;border:2px solid #d9d8d0;border-radius:1rem;padding:1rem;cursor:pointer}.card:has(input:checked){border-color:#18201d}.swatches{display:grid;grid-template-columns:1fr 1fr;height:5rem;border-radius:.5rem;overflow:hidden}.swatches i:first-child{background:var(--light)}.swatches i:last-child{background:var(--dark)}.card small{color:#626a66}output{display:block;margin-top:1.5rem;padding:1rem;background:#18201d;color:white;border-radius:.5rem;font-family:monospace;white-space:pre-wrap}input{width:1.25rem;height:1.25rem}@media(max-width:480px){main{margin:1.5rem auto}.card{min-height:11rem}}</style><main><h1>议题主题 token</h1><p>选择面板只会输出受控 token；颜色、布局与脚本不能由投稿者提交。</p><fieldset><legend>Theme</legend><div class="grid"><label class="card" style="--light:#8C2F1E;--dark:#E08265"><input type="radio" name="theme" value="ember" checked><span class="swatches" aria-hidden="true"><i></i><i></i></span><strong>余烬</strong><small>Ember · ember</small></label><label class="card" style="--light:#285F7A;--dark:#82BDD7"><input type="radio" name="theme" value="ocean"><span class="swatches" aria-hidden="true"><i></i><i></i></span><strong>海洋</strong><small>Ocean · ocean</small></label><label class="card" style="--light:#6A4273;--dark:#C491CF"><input type="radio" name="theme" value="plum"><span class="swatches" aria-hidden="true"><i></i><i></i></span><strong>梅紫</strong><small>Plum · plum</small></label><label class="card" style="--light:#2F6655;--dark:#80BFA7"><input type="radio" name="theme" value="pine"><span class="swatches" aria-hidden="true"><i></i><i></i></span><strong>松绿</strong><small>Pine · pine</small></label></div></fieldset><output id="out"></output><script>const allowed=new Set(["ember","ocean","plum","pine"]);const out=document.getElementById("out");function draw(){const value=document.querySelector("input:checked").value;if(!allowed.has(value))throw new Error("invalid theme token");out.textContent=JSON.stringify({theme_token:value},null,2)}document.addEventListener("change",draw);draw();</script></main></html>

# Public-repo pytest configuration. The eval package is intentionally not exported.
[pytest]
testpaths = packages tests
pythonpath = . packages/schema packages/corpus packages/a1 packages/editorial packages/publish packages/submission tests
addopts = -q
markers =
    repo_artifact: audits this machine's real topics/ or site/ artifacts; may skip on a clean checkout
    cli_e2e: launches a real skill-script CLI in a subprocess

      es: Un servicio de noticias especializadas en japonés para la industria turística, gestionado por
        Travel Voice Inc. y dirigido a responsables de marketing y directivos de empresas de viajes, no
        a viajeros, por lo que sus entregas estadísticas son en gran parte reescrituras de comunicados
        de JNTO y de la Agencia de Turismo de Japón.
      fr: Un service d'information professionnelle en japonais pour le secteur du tourisme, géré par Travel
        Voice Inc. et rédigé à l'intention des responsables marketing et dirigeants d'entreprises de voyage
        plutôt que des voyageurs, de sorte que ses articles statistiques sont pour l'essentiel des réécritures
        des communiqués de JNTO et de l'Agence japonaise du tourisme.
      hi: Travel Voice Inc. द्वारा संचालित पर्यटन उद्योग के लिए एक जापानी-भाषी व्यापारिक समाचार सेवा,
        जो यात्री कंपनियों के मार्केटिंग अधिकारियों और अधिकारियों के लिए लिखी जाती है, न कि यात्रियों
        के लिए, इसलिए इसकी आंकड़ों संबंधी किश्तें मुख्यतः JNTO और जापान पर्यटन एजेंसी की विज्ञप्तियों
        का पुनर्लेखन होती हैं।
      ja: トラベルボイス社が運営する観光業界向けの日本語業界ニュースサービスで、旅行者ではなく旅行会社のマーケティング担当者や経営層向けに書かれており、統計関連の連載記事の多くは日本政府観光局(JNTO)や観光庁の発表の書き直しである。
      ko: 트래블보이스 주식회사가 운영하는 관광업계 대상 일본어 업계 뉴스 서비스로, 일반 여행객이 아니라 여행업계 마케터와 경영진을 대상으로 하며, 통계 관련 기사는 대부분

      zh-CN: 蒙通社（MONTSAME）是蒙古国家通讯社，成立于1921年，以五种语言报道新闻，在全国各地及莫斯科、北京均设有常驻记者；作为国有通讯社，其涉及政府的报道往往反映官方立场。

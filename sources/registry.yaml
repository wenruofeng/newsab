        sus propios reporteros repartidos por las islas; cubre una prefectura cuya economía depende del
        turismo y cuya política está dominada por las bases militares estadounidenses. La mayoría de los
        artículos requieren suscripción digital, y el diario también publica despachos de la agencia Kyodo
        News.
      fr: L'un des deux quotidiens préfectoraux d'Okinawa, publié à Naha par The Ryukyu Shimpo avec ses
        propres journalistes répartis sur les îles ; il couvre une préfecture dont l'économie repose sur
        le tourisme et dont la vie politique est dominée par la question des bases américaines. La plupart
        des articles nécessitent un abonnement numérique, et le journal reprend aussi des dépêches de
        l'agence Kyodo News.
      hi: ओकिनावा प्रान्त के दो प्रमुख प्रांतीय दैनिकों में से एक, जिसे नाहा से The Ryukyu Shimpo द्वारा
        प्रकाशित किया जाता है और जिसके संवाददाता द्वीपों भर में तैनात हैं; यह ऐसे प्रान्त को कवर करता
        है जिसकी अर्थव्यवस्था पर्यटन पर निर्भर है और जिसकी राजनीति पर अमेरिकी सैन्य अड्डों का प्रभुत्व
        है। अधिकांश लेख पढ़ने के लिए डिजिटल सदस्यता आवश्यक है, और यह क्योदो न्यूज़ (Kyodo News) की एजेंसी
        सामग्री भी प्रकाशित करता है।
      ja: 沖縄県の二大県紙の一つで、那覇に拠点を置くThe Ryukyu Shimpo(琉球新報)が独自の記者を県内各島に配置して発行している。観光業に依存する経済と米軍基地問題が政治を左右する沖縄県を取材対象とする。記事の大半はデジタル購読が必要で、共同通信の配信記事も掲載している。
      ko: 오키나와현의 두 개 현 단위 일간지 중 하나로, 나하에서 The Ryukyu Shimpo가 발행하며 섬 전역에 자체 기자를 두고 있다. 관광업에 의존하는 경제와 미군기지가
        좌우하는 정치를 특징으로 하는 현을 취재 대상으로 한다. 대부분의 기사는 디지털 구독이 필요하며, 교도통신(Kyodo News) 배급 기사도 함께 싣는다.
      ru: Одна из двух главных ежедневных газет префектуры Окинава, издаётся в Наха компанией The Ryukyu
        Shimpo силами собственных корреспондентов на островах; освещает регион, экономика которого опирается
        на туризм, а политика во многом определяется присутствием американских военных баз. Большинство
        статей доступны только по цифровой подписке; издание также публикует материалы информационного
        агентства Kyodo News.
      zh-CN: 冲绳两家县级日报之一，由琉球新报社在那霸出版，在县内各岛派驻自有记者，报道这个经济依赖旅游、政治长期围绕驻日美军基地的县；多数文章需订阅数字版，同时也刊登共同通信的通稿。

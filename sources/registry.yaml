      ja: 光明日報グループが発行する書籍・学術出版に関する週刊紙で、報道機関というより書評誌に近い。
      ko: 광명일보 그룹이 발행하는 도서·학술 출판 전문 주간지로, 뉴스 취재보다는 서평지에 가깝다.
      ru: Еженедельник о книгах и академических публикациях издательской группы Guangming Daily, по формату
        ближе к рецензионному журналу, чем к новостной редакции.
      zh-CN: 光明日报报业集团主办的书业与学术周报，性质接近书评刊物而非新闻编辑部。
  url: https://epaper.gmw.cn/

      ja: 与党から離反した保守系ジャーナリストらが創刊したトルコの全国紙で、自社編集部による報道と論説を行っている。
      ko: 집권당과 결별한 보수 성향 언론인들이 창간한 튀르키예의 전국 일간지로, 자체 취재부와 논평을 갖추고 있다.

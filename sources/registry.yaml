  notes:
    values:
      ar: موقع Medee.mn هو بوابة إخبارية عامة منغولية أسسها عام 2009 عالم الاجتماع م. أوتغونبايار عبر
        شركة الرأي العام المنغولي المحدودة، وهناك تقارير غير مؤكدة تربط تأسيسه برئيس البرلمان السابق ز.

  notes:
    values:
      ar: الموقع الإلكتروني لشركة تويو كيزاي، الناشر التجاري في طوكيو لمجلة شوكان تويو كيزاي الأسبوعية
        ودليل الشركات كايشا شيكيهو، وتغطي عبر أقسامها الخاصة شؤون الأعمال والاقتصاد والسياسات؛ إلا أن
        جزءاً كبيراً مما ينشر على الموقع هو تعليقات مطلوبة من اقتصاديين ومستشارين وصحفيين خارجيين تُنشر
        بأسمائهم لا كتقارير من طاقم الموقع.
      en: The website of Toyo Keizai Inc., the Tokyo business publisher of the weekly Shukan Toyo Keizai
        and the Kaisha Shikiho company handbook, which reports business, economic and policy stories through
        its own desks; much of what appears on the site is commissioned commentary by outside economists,
        consultants and journalists, published under their own names rather than reported by its staff.
      es: El sitio web de Toyo Keizai Inc., editorial de negocios de Tokio responsable del semanario Shukan
        Toyo Keizai y del anuario empresarial Kaisha Shikiho, que informa sobre negocios, economía y política
        a través de sus propias redacciones; gran parte del contenido del sitio son comentarios encargados
        a economistas, consultores y periodistas externos, publicados bajo su propio nombre y no como
        reportajes del personal del medio.
      fr: Le site de Toyo Keizai Inc., éditeur économique tokyoïte de l'hebdomadaire Shukan Toyo Keizai
        et de l'annuaire d'entreprises Kaisha Shikiho, qui couvre l'économie, les affaires et les politiques
        publiques avec ses propres services ; une grande partie du contenu du site est constituée de commentaires
        commandés à des économistes, consultants et journalistes extérieurs, publiés sous leur propre
        nom plutôt que rédigés par le personnel du titre.
      hi: टोक्यो के व्यावसायिक प्रकाशक Toyo Keizai Inc. की वेबसाइट, जो साप्ताहिक Shukan Toyo Keizai और
        कंपनी हैंडबुक Kaisha Shikiho भी प्रकाशित करता है और अपने डेस्कों के माध्यम से व्यापार, अर्थव्यवस्था
        व नीति संबंधी खबरें देता है; साइट पर छपने वाली अधिकांश सामग्री बाहरी अर्थशास्त्रियों, सलाहकारों
        और पत्रकारों द्वारा उनके अपने नाम से लिखी गई राय-टिप्पणी है, न कि स्टाफ की रिपोर्टिंग।
      ja: 週刊東洋経済や会社四季報を発行する東京の出版社、東洋経済新報社のウェブサイト。自社取材によりビジネス・経済・政策を報じるが、サイト掲載記事の多くは外部のエコノミストやコンサルタント、ジャーナリストによる寄稿・論評であり、自社記者による取材記事ではない。
      ko: 주간 도요게이자이와 기업 편람 가이샤시키호를 발행하는 도쿄의 비즈니스 출판사 도요게이자이신보사의 웹사이트로, 자체 취재부를 통해 경제·경영·정책 기사를 보도하지만,
        사이트 게재물의 상당 부분은 자사 소속이 아닌 외부 경제학자, 컨설턴트, 언론인이 자기 이름으로 기고한 논평이다.
      ru: Сайт компании Toyo Keizai Inc., токийского делового издательства, выпускающего еженедельник
        Shukan Toyo Keizai и справочник компаний Kaisha Shikiho; освещает деловые, экономические и политические
        темы силами собственных редакций, однако значительная часть материалов сайта — это заказные колонки
        внешних экономистов, консультантов и журналистов, публикуемые под их собственными именами, а не
        репортажи штатных сотрудников.
      zh-CN: 东京财经出版社东洋经济新报社的网站，该社出版《周刊东洋经济》与《会社四季报》，以自有采访部门报道商业、经济与政策；网站上相当一部分内容是外部经济学者、顾问与记者的约稿评论而非采访报道，署作者本人姓名刊出。
  url: https://toyokeizai.net/

        plusieurs reprises dans leurs rapports.
      hi: एक दक्षिणपंथी जर्मन साप्ताहिक और समाचार साइट, जो राष्ट्रीय-रूढ़िवादी और न्यू राइट धड़े के लिए
        एक संदर्भ बिंदु है, जिसकी जर्मन घरेलू-ख़ुफ़िया रिपोर्टों में बार-बार चर्चा हुई है।
      ja: 右派系のドイツの週刊紙・ニュースサイトで、国民保守派やニュー・ライト層の拠り所となっており、ドイツの国内情報機関(憲法擁護庁)の報告書でたびたび取り上げられている。
      ko: 독일의 우파 성향 주간지 겸 뉴스 사이트로, 국가보수·신우파 진영의 준거점 역할을 하며 독일 국내 정보기관 보고서에서 여러 차례 언급된 바 있다.
      ru: Правая немецкая еженедельная газета и новостной сайт, служащий ориентиром для национал-консервативной
        среды и «новых правых»; неоднократно упоминался в отчётах немецких спецслужб по внутренней безопасности.
      zh-CN: 德国右翼周报与新闻网站，是民族保守派与「新右翼」圈子的重要平台，多次被德国国内情报机构的报告提及。

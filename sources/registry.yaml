  name:
    values:
      de: zwd Politikmagazin
      en: zwd Politikmagazin (Zweiwochendienst)
      zh-CN: zwd 政治杂志（双周刊）
  notes:
    values:
      ar: خدمة إخبارية متخصصة في السياسات مقرها برلين، تغطي التعليم والعلوم والثقافة وقضايا السياسة النسائية
        لقراء مهنيين ومؤسسيين، ولديها مراسلون موقّعون خاصون بها؛ تصدر بوتيرة نصف شهرية تقريباً.
      en: A Berlin-based specialist policy news service covering education, science, culture and women's-policy
        topics for a professional/institutional readership, with its own named reporters; published on
        a roughly biweekly cadence.
      es: Un servicio de noticias políticas especializado con sede en Berlín que cubre temas de educación,
        ciencia, cultura y políticas de igualdad para un público profesional e institucional, con periodistas
        propios firmantes; se publica con una periodicidad aproximadamente quincenal.
      fr: Un service spécialisé d'information sur les politiques publiques basé à Berlin, couvrant l'éducation,
        la science, la culture et les questions relatives aux droits des femmes pour un lectorat professionnel
        et institutionnel, avec ses propres journalistes identifiés ; publié à un rythme approximativement
        bimensuel.
      hi: शिक्षा, विज्ञान, संस्कृति व महिला-नीति विषयों पर पेशेवर/संस्थागत पाठकों के लिए बर्लिन स्थित
        एक विशेषज्ञ नीति समाचार सेवा, जिसके अपने नामित रिपोर्टर हैं; यह लगभग हर दो सप्ताह में प्रकाशित
        होती है।
      ja: 教育・科学・文化・女性政策を専門とするベルリン拠点の政策ニュースサービスで、実名の専属記者を持ち、専門職・機関向けの読者層を対象とする。おおむね隔週刊で発行される。
      ko: 베를린에 기반을 둔 전문 정책 뉴스 서비스로, 교육·과학·문화·여성정책 분야를 전문직·기관 독자를 대상으로 다루며 자체 기명 기자를 두고 있고, 대략 격주 주기로 발행된다.
      ru: Берлинский специализированный новостной сервис по вопросам политики, освещающий темы образования,
        науки, культуры и политики в отношении женщин для профессиональной и институциональной аудитории,
        с собственными именными корреспондентами; выходит примерно раз в две недели.
      zh-CN: 总部在柏林的教育、科学、文化与妇女政策专业时政新闻服务，面向专业与机构读者，有署名记者，大致双周出刊。
  url: https://www.zwd.info/

  lang: ja
  name:
    values:
      en: Jiji Press
      ja: 時事通信
      zh-CN: 时事通信社
  notes:
    values:
      ar: وكالة الأنباء الوطنية الثانية في اليابان، وكالة سلكية خاصة مقرها طوكيو تعدّ موادّها الإخبارية
        الخاصة في السياسة والاقتصاد والشؤون الدولية وترسلها إلى الصحف ومحطات البث والعملاء الماليين المشتركين،
        كما تنشرها مباشرة على مواقعها الموجهة للمستهلكين والتعليقات السوقية.
      en: Japan's second national news agency, a private wire service in Tokyo that files its own reported
        copy on politics, the economy and international news to subscribing newspapers, broadcasters and
        financial clients, and also publishes it directly on its own consumer and market-commentary sites.
      es: La segunda agencia de noticias nacional de Japón, un servicio de cable privado con sede en Tokio
        que produce sus propios despachos sobre política, economía e información internacional para periódicos,
        emisoras y clientes financieros suscriptores, y que también los publica directamente en sus propios
        sitios para el público y de análisis de mercado.
      fr: La deuxième agence de presse nationale du Japon, une agence privée basée à Tokyo qui produit
        ses propres dépêches sur la politique, l'économie et l'actualité internationale pour des journaux,
        diffuseurs et clients financiers abonnés, et les publie également directement sur ses propres
        sites grand public et de commentaire de marché.
      hi: जापान की दूसरी राष्ट्रीय समाचार एजेंसी, टोक्यो स्थित एक निजी वायर सेवा, जो राजनीति, अर्थव्यवस्था
        और अंतरराष्ट्रीय समाचारों पर अपनी रिपोर्ट की गई सामग्री सदस्य अख़बारों, प्रसारकों और वित्तीय ग्राहकों
        को भेजती है, और इसे सीधे अपनी उपभोक्ता व बाज़ार-टिप्पणी साइटों पर भी प्रकाशित करती है।
      ja: 日本第2の国内通信社で、東京に拠点を置く民間の配信サービス。政治・経済・国際ニュースを自社取材し、契約する新聞社・放送局・金融関係の顧客に配信するほか、自社の一般向け・市場解説サイトでも直接公開している。
      ko: 일본의 2대 통신사 중 하나로, 도쿄에 본사를 둔 민간 통신사다. 자체 취재한 정치·경제·국제 뉴스를 신문사, 방송사, 금융기관 등 구독 고객에게 배포하며, 자사의
        일반 독자용 사이트와 시황 해설 사이트에도 직접 게재한다.
      ru: Второе по значимости национальное информационное агентство Японии — частная телеграфная служба
        в Токио, поставляющая собственные материалы о политике, экономике и международных событиях подписчикам
        среди газет, вещателей и финансовых клиентов, а также публикующая их напрямую на собственных потребительских
        сайтах и сайтах с рыночными комментариями.
      zh-CN: 日本第二大全国性通讯社，总部设于东京的民营通讯社，就政治、经济与国际新闻自采发稿，供应订户报纸、广播机构与金融客户，并在自营的大众新闻与市场评论网站上直接发布。

      ar: شبكة إخبارية تلفزيونية ورقمية هندية باللغة الهندية، مملوكة لمجموعة "إنديا توداي".
      en: A Hindi-language Indian television and digital news network owned by the India Today Group.
      es: Una cadena india de noticias en televisión y en formato digital en lengua hindi, propiedad del
        grupo India Today Group.
      fr: Un réseau d'information télévisé et numérique indien en langue hindi, appartenant au groupe
        India Today Group.
      hi: इंडिया टुडे ग्रुप के स्वामित्व वाला एक हिंदी भाषा का भारतीय टेलीविज़न और डिजिटल समाचार नेटवर्क।
      ja: インディア・トゥデイ・グループが所有する、ヒンディー語によるインドのテレビ・デジタルニュースネットワーク。
      ko: 인디아투데이 그룹이 소유한 힌디어 인도 텔레비전 및 디지털 뉴스 네트워크.
      ru: Индийская телевизионная и цифровая новостная сеть на языке хинди, принадлежащая группе India
        Today Group.
      zh-CN: India Today Group 旗下的印度印地语电视与数字新闻网络。
  url: https://www.aajtak.in/

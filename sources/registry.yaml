      ar: وكالة مونتسامي هي وكالة الأنباء الرسمية لمنغوليا، تأسست عام 1921 وتنشر أخبارها بخمس لغات عبر
        مراسلين منتشرين في أنحاء البلاد وفي موسكو وبكين؛ وبوصفها وكالة أنباء حكومية، فإن تغطيتها لشؤون

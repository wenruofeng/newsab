  notes:
    values:
      ar: موقع mPress.mn هو موقع إخباري منغولي تتمحور مهمته المعلنة، "من أجل المساواة"، حول تسليط الضوء
        على أصوات النساء والفئات المهمشة في السياسة والاقتصاد والمجتمع، وبينما يقول إنه يلتزم بأخلاقيات

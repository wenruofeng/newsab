    values:
      en: The Mainichi Shimbun
      ja: 毎日新聞
      zh-CN: 每日新闻
  notes:
    values:
      ar: إحدى الصحف اليومية الوطنية الكبرى الثلاث في اليابان، تصدرها مؤسسة ماينيتشي للصحف، وتنشر تقارير
        بأسماء محرريها عبر مكاتب وطنية وإقليمية وخارجية بتوجه تحريري وسطي يميل قليلاً إلى اليسار؛ ومعظم

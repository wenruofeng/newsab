    values:
      ar: خدمة أخبار تجارية ناطقة باليابانية لقطاع السياحة، تديرها شركة Travel Voice Inc، وتُكتب لمسوّقي
        شركات السفر ومديريها لا للمسافرين، لذا فإن أجزاءها الإحصائية هي في الغالب إعادة صياغة لبيانات

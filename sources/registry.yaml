  lang: ja
  name:
    values:
      en: TV Asahi News
      ja: テレ朝news
      zh-CN: 朝日电视台新闻
  notes:
    values:
      ar: الموقع الإخباري لقناة تي في آساهي، القناة التجارية في طوكيو التي تقود شبكة ANN، وتقدّم تقارير
        مراسليها ومحرريها الخاصة في السياسة والاقتصاد والمجتمع والشؤون الدولية؛ ومعظم موادها نصوص قصيرة
        أُعدّت للنشرات الإخبارية، فهي أقصر مما تنشره الصحف عن الموضوع نفسه.
      en: The news site of TV Asahi, the Tokyo commercial broadcaster at the centre of the ANN network,
        carrying its own reporters' and correspondents' packages across politics, economy, society and
        world news; most items are short scripts written for the bulletin, so they are briefer than a
        newspaper's on the same story.
      es: El sitio de noticias de TV Asahi, la cadena comercial de Tokio que encabeza la red ANN, con
        reportajes propios de sus periodistas y corresponsales en política, economía, sociedad y noticias
        internacionales; la mayoría de las piezas son guiones breves escritos para el noticiero, por lo
        que suelen ser más cortas que las de un periódico sobre el mismo tema.
      fr: Le site d'information de TV Asahi, diffuseur commercial tokyoïte au centre du réseau ANN, qui
        diffuse ses propres reportages de journalistes et de correspondants sur la politique, l'économie,
        la société et l'actualité internationale ; la plupart des articles sont de courts scripts rédigés
        pour le journal télévisé, donc plus brefs que ceux d'un quotidien sur le même sujet.
      hi: TV Asahi की समाचार साइट, जो ANN नेटवर्क के केंद्र में स्थित टोक्यो के वाणिज्यिक प्रसारक की खबरें
        देती है और राजनीति, अर्थव्यवस्था, समाज व विश्व समाचार पर अपने रिपोर्टरों व संवाददाताओं की स्वयं
        की सामग्री प्रकाशित करती है; अधिकांश लेख बुलेटिन के लिए लिखी गई संक्षिप्त स्क्रिप्ट होते हैं,
        इसलिए ये किसी अखबार की उसी खबर की तुलना में छोटे होते हैं।
      ja: ANN系列の中心局、テレビ朝日のニュースサイトで、自社記者・特派員による政治・経済・社会・国際ニュースの取材記事を掲載する。掲載記事の多くは放送用に書かれた短い原稿のため、同じ話題を扱う新聞記事より短い。
      ko: ANN 네트워크의 중심인 도쿄 상업 방송사 TV아사히의 뉴스 사이트로, 자체 기자와 특파원이 정치·경제·사회·국제 뉴스를 취재해 보도한다. 대부분의 기사는 뉴스 방송용으로
        작성된 짧은 대본이어서 같은 사안을 다루는 신문 기사보다 분량이 짧다.
      ru: Новостной сайт телекомпании TV Asahi, токийского коммерческого вещателя, возглавляющего сеть
        ANN, публикующий материалы собственных репортёров и корреспондентов по политике, экономике, обществу
        и мировым новостям; большинство материалов — короткие тексты, написанные для эфирного выпуска,
        поэтому они короче, чем аналогичные материалы газет.
      zh-CN: 东京商业电视台朝日电视台（ANN新闻网核心台）的新闻网站，刊载本台记者与驻外特派员采制的政治、经济、社会及国际报道；多数稿件由电视新闻稿改写而成，因此篇幅比报纸的同题报道短。
  url: https://news.tv-asahi.co.jp/

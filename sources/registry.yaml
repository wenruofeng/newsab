        más conservadora entre los diarios nacionales de Japón, lo que influye en cómo enmarca a China.
      fr: Un quotidien national publié à Tokyo et Osaka par The Sankei Shimbun Co., dont les articles
        sont signés par ses propres journalistes issus de bureaux politique, économique, régionaux et
        de Pékin ; c'est le journal national japonais à la ligne éditoriale la plus conservatrice, ce
        qui colore sa manière de présenter la Chine.
      hi: The Sankei Shimbun Co. द्वारा टोक्यो और ओसाका से प्रकाशित एक राष्ट्रीय दैनिक, जो राजनीतिक, आर्थिक,
        क्षेत्रीय और बीजिंग ब्यूरो के माध्यम से अपने ही संवाददाताओं के नाम से रिपोर्टिंग करता है, और जापान
        के राष्ट्रीय समाचार पत्रों में सबसे रूढ़िवादी संपादकीय झुकाव रखता है, जो इसके चीन-संबंधी कवरेज
        को प्रभावित करता है।
      ja: 産経新聞社が東京と大阪で発行する全国紙で、政治部・経済部・地方支局・北京支局を通じて自社記者の署名で報道している。日本の全国紙の中で最も保守的な論調で知られ、それが中国報道の切り口にも影響している。
      ko: 도쿄와 오사카에서 The Sankei Shimbun Co.가 발행하는 전국지로, 정치·경제·지역·베이징 지국을 통해 자사 기자의 실명 기사로 보도한다. 일본 전국지
        가운데 가장 보수적인 논조를 견지하고 있으며, 이는 중국 관련 보도의 시각에도 영향을 준다.
      ru: Общенациональная ежедневная газета, издаваемая в Токио и Осаке компанией The Sankei Shimbun
        Co.; материалы публикуются под собственными подписями корреспондентов через политическое, экономическое,

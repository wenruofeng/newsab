      en: One of Japan's three big national dailies, published by The Mainichi Newspapers, reporting under
        its own bylines through national, prefectural and overseas bureaus with a centre-left editorial
        line; most longer pieces are subscriber-only, so some articles here are lead-only.
      es: Uno de los tres grandes diarios nacionales de Japón, publicado por The Mainichi Newspapers,
        que informa con firma propia a través de redacciones nacionales, provinciales y en el extranjero,
        con una línea editorial de centroizquierda; la mayoría de los artículos extensos son solo para
        suscriptores, por lo que algunos textos aquí aparecen únicamente con la entradilla.
      fr: L'un des trois grands quotidiens nationaux du Japon, publié par The Mainichi Newspapers, dont
        les journalistes signent leurs articles issus de bureaux nationaux, préfectoraux et à l'étranger,
        avec une ligne éditoriale centre-gauche ; la plupart des articles longs sont réservés aux abonnés,
        si bien que certains articles ici ne sont disponibles qu'en version résumée.
      hi: जापान के तीन बड़े राष्ट्रीय दैनिकों में से एक, जिसे द माइनिची न्यूज़पेपर्स प्रकाशित करता है,
        जो राष्ट्रीय, प्रांतीय और विदेशी ब्यूरो के माध्यम से अपने बाइलाइन में केंद्र-वामपंथी संपादकीय
        रुख के साथ रिपोर्टिंग करता है; अधिकांश लंबे लेख केवल सदस्यों के लिए होते हैं, इसलिए यहाँ कुछ लेख
        केवल शुरुआती अंश तक सीमित हैं।
      ja: 毎日新聞社が発行する日本の三大全国紙の一つで、国内・地方・海外の各支局を通じ自社署名記事で報道する中道左派の論調を持つ。長文記事の多くは会員限定のため、本サイトでは冒頭部分のみの記事もある。
      ko: 마이니치신문사가 발행하는 일본 3대 전국 일간지 중 하나로, 국내외 지국망과 자체 기명 기사를 통해 중도좌파 성향의 논조로 보도한다. 대부분의 장문 기사는 유료 구독자
        전용이어서 이 사이트에는 리드 문단만 실린 기사도 있다.
      ru: Одна из трёх крупнейших общенациональных ежедневных газет Японии, издаваемая компанией The Mainichi
        Newspapers; репортажи публикуются под собственными подписями через национальные, префектуральные
        и зарубежные бюро, редакционная линия — левоцентристская; большинство крупных материалов доступны

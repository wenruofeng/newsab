    fetch_notes: 'STILL NO KEYWORD SEARCH: s.huanqiu.com is 403 to plain HTTP and to a browser alike (re-measured
      2026-08-19). But the channel LIST api is plain-HTTP 200 and is enough to route around it when you
      already know roughly when a piece ran: https://world.huanqiu.com/api/list?node="<catnode>"&offset=<n>&limit=<=50
      returns aid / title / summary / ctime (ms epoch) / source.name / host, strictly newest-first with
      contiguous offsets — so binary-search offset to land on a date, then scan forward. The international
      desk is node "/e3pmh22ph/e3pmh2398" at roughly 80 items/day (offset 2600 was 2026-07-17). limit
      returns ~26 by default; limit=50 works. Article URL is https://world.huanqiu.com/article/<aid>.
      Body: NOT in the rendered DOM — the page carries <textarea class="article-content"> holding the
      body HTML, alongside article-title / article-subtitle / article-time (ms epoch) / article-source-name
      / article-editor-name / article-author. Read those rather than parsing the page. (3w.huanqiu.com
      pages still use div.a-con inside div.content-a#article.)

      [2026-09-01] DDG''s site: index for huanqiu.com is heavily stale: it returns pre-window archives
      even while the outlet publishes daily inside the window. Recovered by adding dated phrasing to the
      query (measured in a pub-repo run, 2026-09-01). Do not book a thin DDG site: grid as this outlet''s
      silence.'
    origin_field: <textarea class="article-source-name"> — names the wire and links its original (e.g.
      新华网 linking the exact news.cn URL). Where present this settles origin by lookup, not judgement.
    rate_limit: 'No throttling observed: ~20 list-API calls plus article fetches back to back with no
      pacing, all 200.'
    search_channel: https://world.huanqiu.com/api/list?node="{catnode}"&offset={offset}&limit={limit}
    status: discovery_blocked

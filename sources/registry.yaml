  country: JP
  id: aera_jp
  lang: ja
  name:
    values:
      en: AERA DIGITAL
      ja: AERA DIGITAL（AERA dot.）
      zh-CN: AERA DIGITAL
  notes:
    values:
      ar: الموقع الإخباري لدار "أساهي شيمبون للنشر"، وهي شركة منفصلة عن صحيفة أساهي شيمبون، وينشر التقارير
        الصحفية لمجلته الأسبوعية العامة AERA موقّعة بأسماء كتّابها، إلى جانب كمّ كبير من الأعمدة الخفيفة
        والمحتوى الترفيهي والصحي المكتوب لجذب الزيارات.
      en: The news site of Asahi Shimbun Publications, a separate company from the Asahi Shimbun newspaper,
        carrying the reported journalism of its general-news weekly AERA under its writers' bylines together
        with a large volume of lighter columnist, entertainment and health copy written for traffic.
      es: El sitio de noticias de Asahi Shimbun Publications, una empresa distinta del periódico Asahi
        Shimbun, que publica el periodismo de su semanario de información general AERA firmado por sus
        redactores, junto con un gran volumen de columnas ligeras y contenido de entretenimiento y salud
        pensado para generar tráfico.
      fr: Le site d'information d'Asahi Shimbun Publications, une société distincte du quotidien Asahi
        Shimbun, qui publie les articles journalistiques de son hebdomadaire d'information générale AERA
        sous la signature de ses rédacteurs, aux côtés d'un grand volume de chroniques légères et de contenus
        divertissement et santé conçus pour générer du trafic.
      hi: यह असाही शिंबुन प्रकाशन की समाचार वेबसाइट है, जो असाही शिंबुन अखबार से अलग एक कंपनी है, और अपनी
        सामान्य समाचार साप्ताहिक पत्रिका AERA की रिपोर्टिंग को लेखकों के नाम के साथ प्रकाशित करती है,
        साथ ही ट्रैफ़िक के लिए लिखी गई बड़ी मात्रा में हल्की कॉलम, मनोरंजन और स्वास्थ्य सामग्री भी छापती
        है।
      ja: 朝日新聞社とは別会社である朝日新聞出版のニュースサイトで、総合ニュース週刊誌AERAの記者署名記事を掲載する一方、アクセス数を稼ぐために書かれた軽めのコラムやエンタメ・健康関連の記事も大量に掲載している。
      ko: 신문 아사히신문과는 별개 회사인 아사히신문출판이 운영하는 뉴스 사이트로, 자사 종합주간지 AERA의 취재 기사를 기자 실명으로 게재하는 한편, 트래픽을 위해 작성된
        다량의 가벼운 칼럼·연예·건강 관련 기사도 함께 싣는다.
      ru: Новостной сайт издательства Asahi Shimbun Publications — компании, отдельной от газеты Asahi
        Shimbun, — публикующий журналистские материалы своего общественно-политического еженедельника
        AERA под именами авторов наряду с большим объёмом более лёгких колонок, развлекательных и материалов
        о здоровье, рассчитанных на посещаемость.
      zh-CN: 朝日新闻出版的新闻网站（与《朝日新闻》报社为不同公司），既刊载旗下综合新闻周刊《AERA》的署名采访报道，也刊载大量以流量为导向的轻量专栏、娱乐与健康稿件。
  url: https://dot.asahi.com/

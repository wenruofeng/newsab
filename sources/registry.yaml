      en: mPress.mn is a Mongolian news site whose stated mission, "For Equality," centers on amplifying
        women's and marginalized voices in politics, the economy and society, and while it says it follows
        Press Council ethics, the organization operating it is not otherwise publicly identified.
      es: mPress.mn es un sitio de noticias mongol cuya misión declarada, "Por la igualdad", se centra
        en amplificar las voces de las mujeres y otros grupos marginados en la política, la economía y
        la sociedad; aunque afirma seguir la ética del Consejo de Prensa, la organización que lo gestiona
        no está identificada públicamente por lo demás.
      fr: mPress.mn est un site d'information mongol dont la mission affichée, « Pour l'égalité », consiste
        à donner davantage de visibilité aux voix des femmes et des groupes marginalisés dans la politique,
        l'économie et la société ; il affirme suivre l'éthique du Conseil de la presse, mais l'organisation
        qui l'exploite n'est pas autrement identifiée publiquement.
      hi: mPress.mn एक मंगोलियाई समाचार साइट है जिसका घोषित उद्देश्य "समानता के लिए" है और जो राजनीति,
        अर्थव्यवस्था तथा समाज में महिलाओं और हाशिए पर पड़े समूहों की आवाज़ को उभारने पर केंद्रित है; यह
        प्रेस काउंसिल की आचार-संहिता का पालन करने का दावा करती है, लेकिन इसे संचालित करने वाला संगठन अन्यथा
        सार्वजनिक रूप से पहचाना नहीं गया है।
      ja: mPress.mnは「平等のために(For Equality)」を掲げるモンゴルのニュースサイトで、政治・経済・社会における女性や社会的弱者の声を取り上げることに重点を置いている。プレス評議会の倫理規定に従うとしているが、運営組織については他に公表されている情報はない。
      ko: mPress.mn은 "평등을 위하여(For Equality)"를 표방하는 몽골 뉴스 사이트로, 정치·경제·사회 영역에서 여성과 소외 계층의 목소리를 부각하는 데 주력한다고
        밝히며 언론위원회 윤리 강령을 따른다고 하지만, 이를 운영하는 조직의 정체는 별도로 공개되어 있지 않다.
      ru: mPress.mn — монгольский новостной сайт, заявляющий своей миссией "За равенство" и сосредоточенный
        на освещении голосов женщин и маргинализированных групп в политике, экономике и обществе; издание
        утверждает, что следует этическим нормам Совета по прессе, однако организация, стоящая за ним,
        публично не идентифицирована.
      zh-CN: mPress.mn 是一家蒙古新闻网站，其宗旨“为了平等”侧重于在政治、经济和社会报道中放大女性及边缘群体的声音；网站称遵循新闻理事会的职业道德准则，但其运营机构并未公开披露。
  url: https://mpress.mn/

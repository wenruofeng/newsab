      en: A small Turkish opposition news site carrying a mix of its own short reports and republished
        copy.
      es: Un pequeño sitio de noticias opositor turco que combina breves reportajes propios con contenido
        reproducido de otros medios.
      fr: Un petit site d'information d'opposition turc proposant à la fois ses propres brèves et des
        articles repris d'autres médias.
      hi: एक छोटी तुर्की विपक्षी समाचार वेबसाइट, जिसमें अपनी संक्षिप्त रिपोर्टों और पुनर्प्रकाशित सामग्री
        का मिश्रण होता है।
      ja: 独自の短いレポートと他社記事の転載が混在する、トルコの小規模な野党系ニュースサイト。
      ko: 자체 단신 보도와 재게재 기사를 혼합해 싣는 소규모 튀르키예 야권 성향 뉴스 사이트.
      ru: Небольшой турецкий оппозиционный новостной сайт, публикующий как собственные краткие материалы,
        так и перепечатки.
      zh-CN: 土耳其一家小型反对派新闻网站，兼有自采短稿与转载内容。

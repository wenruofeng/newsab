  name:
    values:
      en: Wing Aviation Press
      ja: 航空新聞社（ウイング）
      zh-CN: 航空新闻社 Wing
  notes:
    values:
      ar: دار النشر طوكيوية Wing Aviation Press، التي تصدر صحيفتيها التجاريتين بالاشتراك Weekly Wing (تأسست
        عام 1957) وWeekly Wing Travel (1969) إلى جانب نسختيهما اليوميتين، وتغطي صناعات الطيران وشركات
        النقل الجوي والسياحة من خلال تقاريرها الخاصة عن وزارات النقل والدفاع والسياحة؛ وهي موجهة لهذه
        الصناعات وليس للمسافرين.
      en: The Tokyo publisher Wing Aviation Press, whose subscription trade papers Weekly Wing (founded
        1957) and Weekly Wing Travel (1969) plus their daily editions cover the aerospace, airline and
        travel industries from its own reporting on the transport, defence and tourism ministries; it
        writes for those industries, not for travellers.
      es: La editorial tokiota Wing Aviation Press, cuyas publicaciones especializadas por suscripción
        Weekly Wing (fundada en 1957) y Weekly Wing Travel (1969), además de sus ediciones diarias, cubren
        las industrias aeroespacial, aérea y del viaje con reportaje propio sobre los ministerios de transporte,
        defensa y turismo; escribe para esas industrias, no para los viajeros.
      fr: L'éditeur tokyoïte Wing Aviation Press, dont les journaux professionnels par abonnement Weekly
        Wing (fondé en 1957) et Weekly Wing Travel (1969), ainsi que leurs éditions quotidiennes, couvrent
        les secteurs de l'aéronautique, du transport aérien et du voyage à partir de son propre travail
        journalistique sur les ministères des Transports, de la Défense et du Tourisme ; il écrit pour
        ces industries, non pour les voyageurs.
      hi: टोक्यो का प्रकाशक विंग एविएशन प्रेस, जिसके सदस्यता-आधारित व्यापार पत्र वीकली विंग (स्थापना 1957)
        और वीकली विंग ट्रैवल (1969) तथा उनके दैनिक संस्करण, परिवहन, रक्षा और पर्यटन मंत्रालयों की अपनी
        रिपोर्टिंग के आधार पर एयरोस्पेस, एयरलाइन और यात्रा उद्योगों को कवर करते हैं; यह यात्रियों के लिए
        नहीं, बल्कि इन उद्योगों के लिए लिखा जाता है।
      ja: 東京の出版社ウイング・アビエーション・プレスが発行する媒体で、購読制の業界紙『週刊ウイング』(1957年創刊)と『週刊トラベルジャーナル』(原文ママ、Weekly Wing Travel、1969年創刊)、およびそれぞれの日刊版を通じて、国土交通省や防衛省・観光関連省庁への独自取材をもとに航空宇宙・航空会社・旅行業界を取材している。読者は旅行者ではなく業界関係者である。
      ko: 도쿄의 출판사 Wing Aviation Press가 발행하는 매체로, 구독제 업계지 '주간윙'(1957년 창간)과 '주간윙 트래블'(1969년 창간) 및 그 일간판을
        통해 국토교통성·방위성·관광청 등을 자체 취재하며 항공우주·항공사·여행 산업을 다룬다. 일반 여행자가 아닌 해당 업계 종사자를 위한 매체다.
      ru: Токийское издательство Wing Aviation Press, чьи отраслевые газеты по подписке Weekly Wing (основана
        в 1957 году) и Weekly Wing Travel (1969), а также их ежедневные выпуски освещают авиастроение,
        авиакомпании и туристическую индустрию на основе собственных репортажей о министерствах транспорта,
        обороны и туризма; издание пишет для профессионалов этих отраслей, а не для туристов.
      zh-CN: 东京的株式会社航空新闻社，旗下订阅制专业报《周刊WING》（1957年创刊）与《周刊WING TRAVEL》（1969年创刊）及其日刊版，依靠自采报道覆盖国土交通、防卫与观光主管部门及航空、旅游产业；读者是业界人士而非一般旅客。
  url: https://www.jwing.net/

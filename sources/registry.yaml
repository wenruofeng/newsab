  name:
    values:
      en: Kanko Keizai Shimbun
      ja: 観光経済新聞
      zh-CN: 观光经济新闻
  notes:
    values:
      ar: صحيفة أسبوعية متخصصة في صناعة السياحة والنزل والفنادق اليابانية، تصدر منذ عام 1950 عن شركة Kankokeizai
        News Corporation، ولديها غرفة أخبار خاصة بها في طوكيو ومكاتب في كانساي وهوكايدو وكيوشو ومراسلون
        موقّعون باسمهم؛ وهي موجهة للعاملين في قطاع السياحة، لذا فإن أولوياتها تتبع اهتمامات هذا القطاع
        لا اهتمامات القارئ العام.
      en: A weekly trade newspaper for Japan's travel, inn and hotel industry, published since 1950 by
        Kankokeizai News Corporation with its own Tokyo newsroom and Kansai, Hokkaido and Kyushu bureaus
        and bylined staff reporting; it writes for tourism operators, so its agenda follows the industry's
        concerns rather than a general reader's.
      es: Un semanario especializado del sector japonés del viaje, los ryokan y la hostelería, publicado
        desde 1950 por Kankokeizai News Corporation, con redacción propia en Tokio y oficinas en Kansai,
        Hokkaido y Kyushu, y reportaje firmado por su personal; escribe para los operadores turísticos,
        por lo que su agenda sigue los intereses del sector más que los de un lector general.
      fr: Un journal professionnel hebdomadaire destiné au secteur japonais du voyage, des auberges et
        de l'hôtellerie, publié depuis 1950 par Kankokeizai News Corporation, avec sa propre rédaction
        à Tokyo et des bureaux dans le Kansai, à Hokkaido et à Kyushu, et des reportages signés par ses
        journalistes ; il écrit pour les professionnels du tourisme, ce qui oriente son agenda vers les
        préoccupations du secteur plutôt que vers celles du grand public.
      hi: जापान के यात्रा, सराय और होटल उद्योग के लिए एक साप्ताहिक व्यापार अख़बार, जो 1950 से कांकोकेइज़ाई
        न्यूज़ कॉर्पोरेशन द्वारा प्रकाशित होता है, जिसका अपना टोक्यो न्यूज़रूम और कांसाई, होक्काइदो व
        क्यूशू ब्यूरो तथा बायलाइन वाली स्टाफ़ रिपोर्टिंग है; यह पर्यटन संचालकों के लिए लिखा जाता है, इसलिए
        इसका एजेंडा सामान्य पाठक के बजाय उद्योग की चिंताओं का अनुसरण करता है।
      ja: 1950年創刊、株式会社観光経済新聞社が発行する日本の旅行・旅館・ホテル業界向け週刊専門紙。東京に自社編集部を持ち、関西・北海道・九州にも支局を置いて署名記事による取材を行っている。観光事業者向けに書かれているため、その論点は一般読者ではなく業界の関心事に沿ったものとなる。
      ko: 1950년부터 Kankokeizai News Corporation이 발행해 온 일본 여행·숙박·호텔 업계 대상 주간 업계지로, 도쿄 본사와 간사이·홋카이도·규슈 지국을
        두고 서명 기자들이 취재한다. 관광 사업자를 위한 매체이므로 논조도 일반 독자보다 업계의 관심사를 따른다.
      ru: Еженедельная отраслевая газета для туристической, гостиничной и ресторанной индустрии Японии,
        издаётся с 1950 года Kankokeizai News Corporation; имеет собственную редакцию в Токио и бюро в
        регионах Кансай, Хоккайдо и Кюсю с именными корреспондентами. Издание работает в интересах туроператоров,
        поэтому его повестка следует за запросами отрасли, а не рядового читателя.
      zh-CN: 面向日本旅游与旅馆酒店业的行业周报，1950年创刊，由株式会社观光经济新闻社出版，设有东京编辑部及关西、北海道、九州支局并以署名记者采写；读者是旅游业者，选题因而贴近业界关切而非一般读者。
  url: https://www.kankokeizai.com/

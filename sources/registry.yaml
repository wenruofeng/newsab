      en: MONTSAME is Mongolia's state news agency, founded in 1921 and reporting in five languages through
        correspondents across the country and in Moscow and Beijing; as a state-owned wire, its coverage
        of the government tends to reflect an official viewpoint.
      es: MONTSAME es la agencia estatal de noticias de Mongolia, fundada en 1921, que informa en cinco
        idiomas a través de corresponsales en todo el país y en Moscú y Pekín; al ser una agencia estatal,
        su cobertura del gobierno tiende a reflejar el punto de vista oficial.
      fr: MONTSAME est l'agence de presse nationale de Mongolie, fondée en 1921, qui diffuse en cinq langues
        via des correspondants répartis dans le pays ainsi qu'à Moscou et Pékin ; en tant qu'agence publique,
        sa couverture du gouvernement tend à refléter le point de vue officiel.
      hi: MONTSAME मंगोलिया की राजकीय समाचार एजेंसी है, जिसकी स्थापना 1921 में हुई थी और जो पूरे देश तथा
        मॉस्को और बीजिंग में संवाददाताओं के माध्यम से पाँच भाषाओं में रिपोर्टिंग करती है; एक राजकीय-स्वामित्व
        वाली वायर एजेंसी होने के कारण, सरकार से जुड़ी इसकी कवरेज अक्सर आधिकारिक दृष्टिकोण को प्रतिबिंबित
        करती है।
      ja: MONTSAMEは1921年創設のモンゴル国営通信社で、国内各地およびモスクワ、北京の特派員を通じて5言語で報道している。国営の通信社であるため、政府に関する報道は公式見解を反映する傾向がある。
      ko: MONTSAME은 1921년 설립된 몽골의 국영 통신사로, 전국 각지와 모스크바·베이징 특파원을 통해 5개 언어로 보도한다. 국영 통신사인 만큼 정부 관련 보도는 공식
        입장을 반영하는 경향이 있다.
      ru: МОНЦАМЭ — государственное информационное агентство Монголии, основанное в 1921 году, ведущее
        репортажи на пяти языках через корреспондентов по всей стране, а также в Москве и Пекине; будучи
        государственным агентством, оно склонно освещать деятельность правительства с официальной точки

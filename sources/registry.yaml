      hi: VIP76.mn, जिसे 2008 से Very Important Person LLC चलाती है, मंगोलियाई सरकारी अधिकारियों के लिए
        एक निर्देशिका-सह-पोर्टल साइट है — प्रोफाइल, निविदाएं और विशेषज्ञ टिप्पणी — न कि एक सामान्य न्यूज़रूम,
        इसलिए पाठकों को इसे स्वतंत्र रिपोर्टिंग के स्रोत के बजाय एक संदर्भ उपकरण के रूप में देखना चाहिए।
      ja: VIP76.mnは2008年からベリー・インポータント・パーソン社が運営する、モンゴルの政府高官に関するディレクトリ・ポータルサイトで、人物プロフィールや入札情報、専門家コメントを掲載する。一般的なニュース編集部ではなくレファレンスツールに近く、独立した取材報道の情報源としてより、参照資料として扱うべきである。

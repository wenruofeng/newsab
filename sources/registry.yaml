      hi: जापान की मुख्य राष्ट्रीय समाचार सहकारी संस्था, जो अपने सदस्य अख़बारों और एनएचके के स्वामित्व
        में है; यह घरेलू व विदेशी ब्यूरो से अपनी रिपोर्ट की गई सामग्री तैयार करती है और इसे 52 सदस्य अख़बारों
        के साथ चलाए जाने वाले 47NEWS पोर्टल पर पाठकों तक पहुँचाती है, इसलिए यही शब्दावली प्रादेशिक दैनिकों
        में भी काफ़ी हद तक दिखाई देती है।
      ja: 加盟新聞社とNHKが出資する日本の主要国内通信社で、国内外の支局から独自に取材した記事を配信するとともに、加盟52社と共同運営する「47NEWS」ポータルで読者向けに直接公開している。そのため同じ文言が各地方紙にもそのまま掲載されることが多い。
      ko: 가맹 신문사들과 NHK가 소유한 일본의 주요 전국 통신협동조합으로, 국내외 지국에서 자체 취재한 기사를 작성해 가맹 신문 52곳과 함께 운영하는 47NEWS 포털을
        통해 독자에게 직접 배포한다. 이 때문에 동일한 문구가 각 지역 일간지에도 그대로 실리는 경우가 많다.
      ru: Главный национальный новостной кооператив Японии, принадлежащий газетам-участникам и телерадиокомпании
        NHK; готовит собственные репортажи через отечественные и зарубежные бюро и публикует их для читателей
        на портале 47NEWS, который ведёт совместно с 52 газетами-участниками, поэтому значительная часть
        текстов дословно повторяется в региональных изданиях.
      zh-CN: 日本主要的全国性通讯社合作组织，由加盟报社与NHK共同所有，依托国内外自有分社署名发稿，并通过其与52家加盟报社共同运营的47NEWS门户直接面向读者，因此同样的文字也常见于各地方报纸。
  url: https://www.47news.jp/

  country: MN
  id: 24tsag_mn
  lang: mn
  name:
    values:
      en: 24Tsag.mn
      mn: 24цаг.мн
      zh-CN: 24Tsag 新闻网
  notes:
    values:
      ar: '"24Tsag.mn" بوابة إخبارية عامة منغولية تديرها شركة Mongolyn Tsakhilgaan Medee المحدودة منذ
        عام 2011، ويرأسها حاليًا ب. تسيبيل، المتحدثة الرسمية السابقة لرئيسي وزراء من الحزب الديمقراطي،
        لذا ينبغي على القراء أخذ هذه الخلفية بعين الاعتبار عند تقييم تغطيتها السياسية.'
      en: 24Tsag.mn is a Mongolian general-news portal run by Mongolyn Tsakhilgaan Medee LLC since 2011,
        currently led by B. Tseepil, a former spokeswoman for two Democratic Party prime ministers, so
        readers should weigh its political coverage with that background in mind.
      es: 24Tsag.mn es un portal de noticias generales de Mongolia gestionado por Mongolyn Tsakhilgaan
        Medee LLC desde 2011, actualmente dirigido por B. Tseepil, ex portavoz de dos primeros ministros
        del Partido Demócrata, por lo que los lectores deberían tener en cuenta este antecedente al valorar
        su cobertura política.
      fr: 24Tsag.mn est un portail d'information générale mongol géré par Mongolyn Tsakhilgaan Medee LLC
        depuis 2011, actuellement dirigé par B. Tseepil, ancienne porte-parole de deux premiers ministres
        du Parti démocrate, ce dont les lecteurs devraient tenir compte en évaluant sa couverture politique.
      hi: 24Tsag.mn मंगोलिया का एक सामान्य समाचार पोर्टल है, जिसे 2011 से Mongolyn Tsakhilgaan Medee LLC
        द्वारा संचालित किया जाता है और वर्तमान में इसका नेतृत्व बी. त्सीपिल कर रही हैं, जो डेमोक्रेटिक
        पार्टी के दो प्रधानमंत्रियों की पूर्व प्रवक्ता रह चुकी हैं, इसलिए पाठकों को इसके राजनीतिक कवरेज
        को इस पृष्ठभूमि के साथ तौलना चाहिए।
      ja: 24Tsag.mnは、2011年からMongolyn Tsakhilgaan Medee LLCが運営するモンゴルの総合ニュースポータルで、現在は民主党出身の首相2人の元報道官であるB・ツェーピル氏が率いており、読者はその経歴を踏まえて同サイトの政治報道を読む必要がある。
      ko: 24Tsag.mn은 2011년부터 Mongolyn Tsakhilgaan Medee LLC가 운영하는 몽골의 종합 뉴스 포털로, 현재 두 명의 민주당 총리를 지낸 대변인
        출신인 B. 체필이 이끌고 있어 독자들은 이러한 배경을 감안해 정치 보도를 읽어야 한다.
      ru: «24Tsag.mn» — монгольский информационный портал общего профиля, которым с 2011 года управляет
        компания Mongolyn Tsakhilgaan Medee LLC; в настоящее время его возглавляет Б. Цээпил, бывшая пресс-секретарь
        двух премьер-министров от Демократической партии, поэтому читателям стоит учитывать это при оценке
        его освещения политики.
      zh-CN: 24Tsag.mn 是蒙古综合新闻门户网站，自2011年起由“Mongolyn Tsakhilgaan Medee”有限责任公司运营，现任负责人 B. Tseepil 曾任两位民主党总理的新闻发言人，读者阅读其政治报道时可留意这一背景。
  url: https://www.24tsag.mn/

  name:
    values:
      en: Traicy
      ja: トライシー
      zh-CN: Traicy（トライシー）
  notes:
    values:
      ar: موقع إخباري في طوكيو معني بالسفر والطيران، أطلقته شركة Traicy Japan Inc عام 2011، موجه أساساً
        للمستهلكين ويُعاد نشره في بوابات إخبارية أخرى؛ ومواده عن الخطوط الجوية والأسعار هي إعادة صياغة
        موجزة لبيانات شركات الطيران والمشغلين موقّعة باسم هيئة التحرير لا تقارير محررين بأسمائهم، كما
        يبيع الموقع إعلانات تعاون مع شركات الطيران والهيئات السياحية.
      en: A Tokyo travel and aviation news site launched in 2011 by Traicy Japan Inc., aimed mainly at
        consumers and syndicated to news portals; its route and fare items are short restatements of airline
        and operator announcements signed by the editorial desk rather than bylined reporting, and it
        also sells tie-up advertising to airlines and tourist boards.
      es: Un sitio de noticias de viajes y aviación con sede en Tokio, lanzado en 2011 por Traicy Japan
        Inc., dirigido principalmente a consumidores y distribuido a portales de noticias; sus notas sobre
        rutas y tarifas son breves resúmenes de comunicados de aerolíneas y operadores firmados por la
        redacción, no reportajes con firma propia, y el medio también vende publicidad y acuerdos de colaboración
        a aerolíneas y oficinas de turismo.
      fr: Un site tokyoïte d'actualités du voyage et de l'aviation lancé en 2011 par Traicy Japan Inc.,
        destiné principalement aux consommateurs et repris par des portails d'information ; ses articles
        sur les itinéraires et les tarifs sont de brèves reformulations des annonces des compagnies aériennes
        et des opérateurs, signées par la rédaction plutôt que par des journalistes identifiés, et le
        site vend également des partenariats publicitaires à des compagnies aériennes et des offices de
        tourisme.
      hi: 2011 में Traicy Japan Inc. द्वारा शुरू की गई टोक्यो की यात्रा व विमानन समाचार साइट, जो मुख्यतः
        उपभोक्ताओं के लिए है और अन्य समाचार पोर्टलों पर भी प्रकाशित होती है; इसके रूट और किराया संबंधी
        लेख संपादकीय डेस्क द्वारा हस्ताक्षरित एयरलाइन व ऑपरेटर घोषणाओं के संक्षिप्त पुनर्लेखन होते हैं,
        न कि बायलाइन वाली रिपोर्टिंग, और यह एयरलाइनों व पर्यटन बोर्डों को साझेदारी विज्ञापन भी बेचती है।
      ja: 2011年にトライシー・ジャパン社が開設した東京の旅行・航空ニュースサイトで、主に消費者向けにニュースポータルへ配信される。路線・運賃関連の記事は航空会社や事業者の発表を短く再構成した編集部署名の記事であり、署名取材記事ではない。航空会社や観光局とのタイアップ広告も販売している。
      ko: 2011년 트레이시 재팬이 창업한 도쿄의 여행·항공 뉴스 사이트로, 주로 일반 소비자를 대상으로 하며 뉴스 포털에도 배포된다. 항공 노선·요금 관련 기사는 항공사와
        운항사의 발표를 편집부 명의로 짧게 재정리한 것으로 기명 취재 기사가 아니며, 항공사와 관광청을 대상으로 제휴 광고도 판매한다.
      ru: Токийский сайт новостей о путешествиях и авиации, запущенный в 2011 году компанией Traicy Japan
        Inc., ориентированный в основном на потребителей и распространяемый через новостные порталы; заметки
        о маршрутах и тарифах представляют собой краткие пересказы заявлений авиакомпаний и операторов,
        подписанные редакцией, а не самостоятельные репортажи; сайт также продаёт рекламные партнёрства
        авиакомпаниям и туристическим ведомствам.
      zh-CN: 2011年创刊、由TRAICY Japan公司运营的东京旅游与航空资讯网站，主要面向消费者并向各新闻门户分发；航线与票价类稿件多为对航空公司与运营方公告的简短转述，署名为编辑部而非记者，同时承接航空公司与旅游局的广告合作。
  url: https://www.traicy.com/

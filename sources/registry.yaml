  country: TR
  id: aa_tr
  lang: tr
  name:
    values:
      en: Anadolu Agency
      tr: Anadolu Ajansı
      zh-CN: 阿纳多卢通讯社
  notes:
    values:
      ar: وكالة الأنباء الرسمية التركية، التي تملك الخزانة التركية حصة الأغلبية فيها وتُعد وكالة الأنباء
        الرئيسية في البلاد؛ يُعاد نشر موادها في مختلف أنحاء الصحافة التركية.
      en: Türkiye's state news agency, majority-owned by the Turkish treasury and the country's main wire;
        its copy is reprinted across the Turkish press.
      es: La agencia de noticias estatal de Türkiye, cuya participación mayoritaria pertenece al Tesoro
        turco y que es la principal agencia de cable del país; sus despachos se reproducen en toda la
        prensa turca.
      fr: L'agence de presse d'État de la Turquie, majoritairement détenue par le Trésor turc et principale
        agence de dépêches du pays; ses articles sont repris par l'ensemble de la presse turque.
      hi: तुर्किए की सरकारी समाचार एजेंसी, जिसका बहुसंख्यक स्वामित्व तुर्की के खजाना विभाग के पास है और
        जो देश की प्रमुख वायर सेवा है; इसकी खबरें तुर्की के समाचार पत्रों में व्यापक रूप से पुनर्प्रकाशित
        होती हैं।
      ja: トルコ財務省が過半数株式を保有する国営通信社で、同国の主要通信社であり、その配信記事はトルコ国内の報道機関全体で転載されている。
      ko: 튀르키예 재무부가 지분 과반을 보유한 국영 통신사로, 튀르키예의 주요 통신사이며 그 기사는 튀르키예 언론 전반에 전재된다.
      ru: Государственное информационное агентство Турции, контрольный пакет которого принадлежит казначейству
        страны, и основная новостная лента страны; его материалы перепечатываются турецкой прессой повсеместно.
      zh-CN: 土耳其的国家通讯社，多数股权由土耳其财政部持有，是该国主要通讯社，稿件被土耳其媒体广泛转载。
  url: https://www.aa.com.tr/

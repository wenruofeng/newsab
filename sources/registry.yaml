    values:
      ar: الصحيفة اليومية الرسمية لمقاطعتي كيوتو وشيغا، تصدر في كيوتو عن The Kyoto Shimbun، وتغطي أقسامها
        الخاصة مدينة يعتمد اقتصادها بشكل كبير على السياحة؛ ومعظم موقعها محجوب خلف اشتراك عضوية، والمقالات
        المصنّفة تحت قسم "全国の記事" هي موادّ من وكالة كيودو وليست تقارير خاصة بها.
      en: The prefectural daily of Kyoto and Shiga, published in Kyoto by The Kyoto Shimbun, whose own
        desks cover a city whose economy leans heavily on tourism; much of its site is behind a membership
        wall, and articles filed under the "全国の記事" section are Kyodo News wire copy rather than its own
        reporting.
      es: El diario provincial de Kioto y Shiga, publicado en Kioto por The Kyoto Shimbun, cuyas propias
        secciones cubren una ciudad cuya economía depende en gran medida del turismo; gran parte del sitio
        está tras un muro de membresía, y los artículos publicados en la sección "全国の記事" son despachos
        de la agencia Kyodo News y no reportaje propio.
      fr: Le quotidien préfectoral de Kyoto et Shiga, publié à Kyoto par The Kyoto Shimbun, dont les rédactions
        couvrent une ville dont l'économie repose largement sur le tourisme ; une grande partie de son
        site est réservée aux abonnés, et les articles publiés dans la rubrique « 全国の記事 » sont des dépêches
        de Kyodo News plutôt que des reportages maison.
      hi: क्योतो और शिगा का प्रांतीय दैनिक अख़बार, जो क्योतो से द क्योतो शिम्बुन द्वारा प्रकाशित होता
        है, जिसके अपने डेस्क एक ऐसे शहर को कवर करते हैं जिसकी अर्थव्यवस्था काफ़ी हद तक पर्यटन पर निर्भर
        है; इसकी साइट का अधिकांश भाग सदस्यता-दीवार के पीछे है, और "全国の記事" खंड के तहत दाख़िल लेख इसकी अपनी
        रिपोर्टिंग के बजाय क्योदो न्यूज़ की वायर सामग्री हैं।
      ja: 京都新聞社が京都で発行する京都・滋賀の県紙で、自社編集部が観光業への依存度が高い地域経済を取材している。サイトの大部分は会員限定であり、「全国の記事」欄に掲載される記事は自社取材ではなく共同通信の配信記事である。
      ko: 교토신문사가 교토에서 발행하는 교토·시가 지역 일간지로, 관광업 의존도가 높은 지역 경제를 자체 취재부가 다룬다. 사이트 대부분이 회원제 유료 벽으로 막혀 있으며,
        '全国の記事'(전국 기사) 섹션에 실린 기사는 자체 취재가 아니라 교도통신의 통신사 기사다.
      ru: Префектуральная ежедневная газета Киото и Сиги, издаётся в Киото компанией The Kyoto Shimbun;
        собственные отделы издания освещают город, экономика которого сильно зависит от туризма. Значительная
        часть сайта доступна только по платной подписке, а материалы в разделе «全国の記事» представляют собой
        копию агентства Kyodo News, а не собственные репортажи.
      zh-CN: 京都与滋贺两府县的地方日报，由京都新闻社在京都出版，自有采访部门报道这座高度依赖旅游业的城市；网站多数内容需注册会员阅读，归入「全国の記事」栏目的稿件为共同通信通稿，并非其自采报道。

      en: Medee.mn is a Mongolian general-news portal founded in 2009 by sociologist M. Otgonbayar through
        Mongolian Public Opinion LLC, with unconfirmed reports linking its founding to former parliament
        speaker Z. Enkhbold, so readers should treat its political coverage with that possible tie in
        mind.
      es: Medee.mn es un portal mongol de noticias generales fundado en 2009 por el sociólogo M. Otgonbayar
        a través de Mongolian Public Opinion LLC, con informes no confirmados que vinculan su fundación
        al expresidente del parlamento Z. Enkhbold, por lo que los lectores deberían tener presente ese
        posible vínculo al leer su cobertura política.
      fr: Medee.mn est un portail d'actualité générale mongol fondé en 2009 par le sociologue M. Otgonbayar
        via la société Mongolian Public Opinion LLC ; des informations non confirmées relient sa fondation
        à l'ancien président du Parlement Z. Enkhbold, ce dont les lecteurs devraient tenir compte pour
        sa couverture politique.
      hi: Medee.mn एक मंगोलियाई सामान्य समाचार पोर्टल है, जिसे 2009 में समाजशास्त्री एम. ओत्गोनबायार ने
        मंगोलियन पब्लिक ओपिनियन एलएलसी के माध्यम से स्थापित किया था; असत्यापित रिपोर्टों में इसकी स्थापना
        को पूर्व संसद अध्यक्ष जेड. एन्खबोल्ड से जोड़ा जाता है, इसलिए पाठकों को इसकी राजनीतिक कवरेज देखते
        समय इस संभावित संबंध का ध्यान रखना चाहिए।
      ja: Medee.mnは2009年に社会学者M.オトゴンバヤル氏がモンゴル世論有限会社を通じて設立したモンゴルの総合ニュースポータルで、その設立が前国会議長Z.エンフボルド氏と関係しているとの未確認の情報もあり、読者はその政治報道をその可能性のあるつながりを念頭に置いて読むべきである。
      ko: Medee.mn은 2009년 사회학자 M. 오트곤바야르가 '몽골 여론(Mongolian Public Opinion) LLC'를 통해 설립한 몽골의 종합 뉴스 포털로,
        전 국회의장 Z. 엥흐볼드와의 설립 관련성을 시사하는 미확인 보도가 있어 독자는 정치 보도를 접할 때 이러한 연관 가능성을 염두에 둘 필요가 있다.
      ru: Medee.mn — монгольский новостной портал общей тематики, основанный в 2009 году социологом М.
        Отгонбаяром через компанию Mongolian Public Opinion LLC; есть неподтверждённые сообщения о связи
        его основания с бывшим спикером парламента З. Энхболдом, поэтому читателям стоит учитывать эту
        возможную связь при оценке его политических материалов.
      zh-CN: Medee.mn 是蒙古综合新闻门户网站，2009年由社会学家 M. Otgonbayar 通过“Mongolian Public Opinion”有限责任公司创办，坊间有未经证实的说法称其创办与前国家大呼拉尔主席
        Z. Enkhbold 有关，读者阅读其政治报道时可留意这一点。
  url: https://www.medee.mn/

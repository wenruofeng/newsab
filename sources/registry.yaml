  notes:
    values:
      ar: مطبوعة تجارية ألمانية متخصصة في الزراعة وأعمال المزارع تصدرها دار Deutscher Landwirtschaftsverlag،
        وتُكتب للمزارعين وصناعة الغذاء.
      en: The German agriculture and farm-business trade title of the Deutscher Landwirtschaftsverlag,
        writing for farmers and the food industry.
      es: La publicación especializada alemana de agricultura y negocios agrícolas de Deutscher Landwirtschaftsverlag,
        dirigida a agricultores y a la industria alimentaria.
      fr: Le titre professionnel allemand consacré à l'agriculture et à l'agro-industrie publié par Deutscher
        Landwirtschaftsverlag, destiné aux agriculteurs et à l'industrie alimentaire.
      hi: Deutscher Landwirtschaftsverlag द्वारा प्रकाशित जर्मनी की कृषि और कृषि-व्यवसाय व्यापार पत्रिका,
        जो किसानों और खाद्य उद्योग के लिए लिखी जाती है।
      ja: Deutscher Landwirtschaftsverlag社が発行するドイツの農業・農業ビジネス専門紙で、農家や食品業界向けに書かれている。
      ko: 도이체 란트비어트샤프트스페어락(Deutscher Landwirtschaftsverlag)이 발행하는 독일의 농업·농업경영 전문지로, 농민과 식품 업계 독자를 대상으로
        한다.
      ru: Немецкое отраслевое издание о сельском хозяйстве и агробизнесе, выпускаемое издательством Deutscher
        Landwirtschaftsverlag и рассчитанное на фермеров и предприятия пищевой промышленности.
      zh-CN: 德国农业出版社旗下的农业与农场经营行业刊物，面向农民与食品产业。
  url: https://www.agrarheute.com/
